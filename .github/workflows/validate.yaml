name: Validate manifests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.25.0"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: Install yq
        run: |
          go install github.com/mikefarah/yq/v4@v4.54.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install schema validator
        run: python3 -m pip install -r requirements-validation.txt
      - name: Validate manifests and references
        run: python3 scripts/validate-repo.py --schemas
      - name: Test manifest checks
        run: python3 -m unittest discover -s tests

name: Validate manifests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"
      # Fails fast on a head that Provider sync is about to replace with the synced pins.
      - name: Check the provider pins against the Turtles catalogue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/sync-providers.py --check
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.3"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - name: Install yq
        run: |
          go install github.com/mikefarah/yq/v4@v4.54.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install schema validator
        run: python3 -m pip install -r requirements-validation.txt
      - name: Validate manifests and references
        run: python3 scripts/validate-repo.py --schemas
      - name: Test manifest checks
        run: python3 -m unittest discover -s tests
